{% extends "events_app/base.html" %}

{% block title %}Change password | Event Listings{% endblock %}

{% block content %}
  <section class="form-shell">
    <p class="subheading">Security</p>
    <h1>Change password</h1>
    <p>Choose a new password for your account. You will stay signed in after updating it.</p>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button class="button" type="submit">Update password</button>
        <a class="button secondary" href="{% url 'events:my_page' %}">Back to My page</a>
      </div>
    </form>
  </section>
{% endblock %}
