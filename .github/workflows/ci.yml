name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: python3 -m uv run ruff check .
      - name: Django check
        run: python3 -m uv run python manage.py check
      - name: Pytest
        run: python3 -m uv run pytest
